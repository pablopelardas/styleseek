<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StyleSeek playground</title>
  </head>
  <body>
    <!--
      Put the cursor anywhere inside a class name below and press Ctrl+Alt+S
      (Find Selected Selector). It must capture the WHOLE token, hyphens and
      all — VS Code's default word definition would stop at the first `-`.
    -->
    <div class="org-tree">
      <div class="org-tree__header">Header</div>
      <div class="org-tree__controls">
        <button class="org-tree__controls-button">Click</button>
      </div>
    </div>

    <table class="table">
      <thead class="table__header">
        <tr class="table__header__controls"></tr>
      </thead>
    </table>
  </body>
</html>
