name: CI

on:
  push:
    # The default branch is referenced by both names so renaming it later
    # does not silently stop the workflow from running.
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Path handling and line endings differ enough between the two that a
        # green Linux run says nothing about Windows, where this is developed.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Bundle smoke test
        run: npm run smoke

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build VSIX
        run: npm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v5
        with:
          name: styleseek-vsix
          path: styleseek.vsix
          if-no-files-found: error
