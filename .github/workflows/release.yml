name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify, but do not publish anywhere'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Publish to the Marketplace
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tag is the only thing a human types during a release, so it is the
      # only thing that can silently disagree with the manifest. Catching that
      # here is cheaper than burning a version number on the Marketplace,
      # where a published version can never be reused.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag v$TAG does not match package.json version $MANIFEST."
            exit 1
          fi

      - name: Require the publishing token
        if: ${{ !inputs.dry_run }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Secret VSCE_PAT is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # The full gate, not a subset: nothing reaches the Marketplace that has
      # not passed the same checks every pull request has to pass.
      - name: Verify
        run: npm run verify

      - name: Package
        run: npm run package

      - name: Extract release notes from the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > RELEASE_NOTES.md

      - name: Create the GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" styleseek.vsix \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md

      - name: Publish to the Visual Studio Marketplace
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        # Publishing the built artifact, not rebuilding: what reaches the
        # Marketplace is byte-for-byte what is attached to the release.
        run: npx vsce publish --no-dependencies --packagePath styleseek.vsix

      - name: Upload the VSIX as a build artifact
        uses: actions/upload-artifact@v5
        with:
          name: styleseek-vsix
          path: styleseek.vsix
          if-no-files-found: error
